# Dependency update policy.
#
# Cooldown is the supply-chain control here: malicious package versions are
# typically published and pulled within 24-72 hours, so no version is adopted
# until it has been public for at least 7 days (14 for semver-major bumps).
# Cooldown applies to version updates only; security updates are exempt and
# are raised immediately.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # The optional @splunk/* visualization packages (installed locally via
    # install-splunk-viz, deliberately absent from the lockfile so Dependabot
    # cannot see the constraint) peer-require styled-components ^5.3.10 and
    # react/react-dom ^18.3.1. Major bumps of these would break Splunk viz
    # rendering — do not propose them until @splunk/visualizations supports
    # the newer majors.
    ignore:
      - dependency-name: "styled-components"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
